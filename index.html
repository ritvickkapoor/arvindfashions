<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arvind Fashions: value tree</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --side:#3A0A17; --side-2:#512732; --side-ink:#ECEEF6; --side-mute:#A3A8C6;
  --accent:#004CAA; --accent-soft:#E6EEF8; --accent-ink:#00408F; --edge:#C9D3E3;
  --sky:#EDF3FB; --sky-2:#A9C8EE;
  --g1:#9E1B3C; --g2:#1F2B4D; --orange:#9E1B3C; --tot:#3A0A17;
  --bg:#F4F6FA; --card:#FFFFFF; --ink:#141A26; --mute:#5A6273; --line:#DCE2EC; --line-2:#EBEFF5;
  --bad:#C8372D; --bad-soft:#FBE7E4; --good:#1C8C3C; --good-soft:#E1F4E5; --flat:#9895AE; --flat-soft:#EEEFF5;
  --amber:#B26B00; --amber-soft:#FBF0DD; --grey-card:#F2F5FA; --signal:#01C964;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --side:#071833; --side-2:#16305A; --side-ink:#ECEEF6; --side-mute:#9DA2C2;
  --accent:#6FA6EE; --accent-soft:#16294A; --accent-ink:#9CC2F5; --sky:#14223A; --sky-2:#244070; --edge:#33405A;
  --g1:#AC3D59; --g2:#404A67; --orange:#AC3D59; --tot:#6F9FE0;
  --bg:#0C1220; --card:#141C2C; --ink:#E9EEF6; --mute:#9EA8BA; --line:#273246; --line-2:#1E2838;
  --bad:#F1857A; --bad-soft:#3A1E24; --good:#4FD196; --good-soft:#15342A; --flat:#8C89A6; --flat-soft:#24213F;
  --amber:#E6B04E; --amber-soft:#3A3020; --grey-card:#18223A; color-scheme: dark; } }
:root[data-theme="dark"]{
  --side:#071833; --side-2:#16305A; --side-ink:#ECEEF6; --side-mute:#9DA2C2;
  --accent:#6FA6EE; --accent-soft:#16294A; --accent-ink:#9CC2F5; --sky:#14223A; --sky-2:#244070; --edge:#33405A;
  --g1:#AC3D59; --g2:#404A67; --orange:#AC3D59; --tot:#6F9FE0;
  --bg:#0C1220; --card:#141C2C; --ink:#E9EEF6; --mute:#9EA8BA; --line:#273246; --line-2:#1E2838;
  --bad:#F1857A; --bad-soft:#3A1E24; --good:#4FD196; --good-soft:#15342A; --flat:#8C89A6; --flat-soft:#24213F;
  --amber:#E6B04E; --amber-soft:#3A3020; --grey-card:#18223A; color-scheme: dark; }
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); height:100%; }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; height:100%; background:var(--bg); color:var(--ink); font-family:"IBM Plex Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif; font-variant-numeric:tabular-nums; font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased; }
button{ font:inherit; color:inherit; cursor:pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, [tabindex]:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
.grad{ background:linear-gradient(90deg,var(--g1),var(--g2)); -webkit-background-clip:text; background-clip:text; color:transparent; }
.app{ display:grid; grid-template-columns:236px 1fr; min-height:100%; }
/* sidebar */
.side{ background:var(--side); color:var(--side-ink); display:flex; flex-direction:column; padding:22px 14px 18px; position:sticky; top:0; height:100vh; height:100dvh; }
.brand{ padding:2px 8px 26px; }
.brand .wm{ font-weight:800; font-size:19px; letter-spacing:.14em; }
.brand .rule{ height:3px; width:58px; border-radius:2px; background:linear-gradient(90deg,var(--g1),var(--g2)); margin:7px 0 8px; }
.brand span{ color:var(--side-mute); font-size:12.5px; display:block; }
.nav{ display:flex; flex-direction:column; gap:2px; }
.nav button{ display:flex; align-items:center; gap:13px; background:none; border:0; color:var(--side-mute); padding:10px 12px; border-radius:8px; text-align:left; font-size:14.5px; font-weight:500; }
.nav button:hover{ color:var(--side-ink); }
.nav button.on{ background:var(--side-2); color:#fff; font-weight:600; }
.nav svg{ width:19px; height:19px; flex:none; stroke:currentColor; fill:none; stroke-width:1.7; }
.badge{ margin-left:auto; background:var(--orange); color:#fff; border-radius:999px; font-size:11.5px; min-width:21px; height:21px; display:grid; place-items:center; font-weight:700; }
.side-foot{ margin-top:auto; color:var(--side-mute); font-size:12px; padding:8px; line-height:1.5; }
.side-foot b{ color:var(--side-ink); font-weight:600; display:block; margin-bottom:2px; }
.side-foot button{ background:none; border:0; color:var(--side-ink); padding:10px 0 0; font-weight:600; font-size:12.5px; text-decoration:underline; text-underline-offset:3px; }
/* top */
.main{ min-width:0; display:flex; flex-direction:column; }
.top{ background:var(--card); border-bottom:1px solid var(--line); padding:14px 28px; position:sticky; top:env(safe-area-inset-top,0px); z-index:20; display:flex; align-items:center; gap:18px; flex-wrap:wrap; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:var(--card); }
.co{ display:flex; flex-direction:column; margin-right:6px; }
.co h1{ font-size:17px; margin:0; font-weight:700; letter-spacing:-.01em; white-space:nowrap; }
.co span{ font-size:12px; color:var(--mute); }
.filters{ display:flex; gap:7px; flex-wrap:wrap; align-items:center; }
.sel{ position:relative; display:flex; align-items:center; border:1px solid var(--line); border-radius:8px; background:var(--card); padding:0 8px 0 11px; height:38px; gap:5px; }
.sel label{ color:var(--mute); font-size:13px; white-space:nowrap; }
.sel select{ appearance:none; border:0; background:transparent; font:inherit; font-size:13.5px; font-weight:600; color:var(--ink); padding:0 20px 0 2px; height:36px; cursor:pointer; max-width:150px; field-sizing:content; }
.sel::after{ content:""; position:absolute; right:11px; top:15px; width:6px; height:6px; border-right:1.6px solid var(--mute); border-bottom:1.6px solid var(--mute); transform:rotate(45deg); pointer-events:none; }
.sel select option{ color:#1C1838; }
.seg{ display:inline-flex; border:1px solid var(--line); border-radius:8px; padding:3px; align-items:center; height:38px; background:var(--grey-card); }
.seg span{ color:var(--mute); padding:0 6px 0 6px; font-size:12.5px; }
.seg button{ border:0; background:none; padding:5px 11px; border-radius:6px; font-size:13.5px; color:var(--mute); }
.seg button.on{ background:var(--card); color:var(--ink); font-weight:600; box-shadow:0 1px 2px rgba(28,24,56,.12); }
.page{ padding:26px 30px 70px; max-width:1640px; }
/* headline */
.headline{ margin:0 0 6px; font-size:25px; line-height:1.3; font-weight:700; letter-spacing:-.015em; }
.takeaway{ margin:0 0 18px; font-size:16px; color:var(--ink); }
.dek{ color:var(--mute); font-size:15px; margin:0 0 22px; max-width:900px; }
.lens-note{ margin:0 0 18px; color:var(--ink); font-size:13.5px; background:var(--sky); border-radius:8px; padding:10px 14px; max-width:1100px; }
.lens-note button{ margin-left:8px; border:1px solid var(--accent); color:var(--accent-ink); background:transparent; border-radius:6px; padding:2px 10px; font-size:12.5px; font-weight:600; }
/* stat band (annual report style: number, caption, vertical rule) */
.stats{ display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); background:var(--card); border:1px solid var(--line); border-radius:12px; padding:18px 6px; margin-bottom:22px; }
.stat{ border-left:1.5px solid var(--line); padding:2px 16px 0; text-align:left; background:none; border-top:0; border-right:0; border-bottom:0; position:relative; min-width:0; display:flex; flex-direction:column; }
.stat:first-child{ border-left:0; }
.stat:hover .sv{ color:var(--accent-ink); }
.stat .sl{ color:var(--mute); font-size:13px; font-weight:500; }
.stat .sv{ font-size:26px; font-weight:700; letter-spacing:-.02em; margin:2px 0 0; }
.stat .sv small{ font-size:13px; color:var(--mute); font-weight:500; margin-left:3px; }
.stat .sc{ font-size:12.5px; color:var(--mute); }
.stat .sd{ font-size:12.5px; font-weight:600; }
.stat.na .sv{ color:var(--flat); font-size:14px; font-weight:500; margin-top:8px; }
.stat .sc{ margin-bottom:10px; }
.stat .spk{ margin-top:auto; padding-top:8px; width:100%; border-top:1px dashed var(--line); } .stat .spk svg{ display:block; width:100%; height:22px; }
.bad-t{ color:var(--bad); } .good-t{ color:var(--good); } .flat-t{ color:var(--mute); }
/* tabs */
.tabrow{ display:flex; align-items:flex-end; gap:20px; flex-wrap:wrap; margin-bottom:12px; justify-content:space-between; }
.tabs{ display:flex; gap:26px; border-bottom:1px solid var(--line); }
.tabs button{ border:0; background:none; padding:8px 0 10px; font-size:15px; color:var(--mute); border-bottom:2.5px solid transparent; margin-bottom:-1px; }
.tabs button.on{ color:var(--ink); font-weight:700; border-color:var(--orange); }
.legend{ display:flex; gap:14px; color:var(--mute); font-size:12.5px; flex-wrap:wrap; align-items:center; }
.legend i{ display:inline-block; width:10px; height:10px; border-radius:2px; margin-right:5px; vertical-align:0; }
.legend .how{ border:0; background:none; color:var(--accent-ink); font-weight:600; text-decoration:underline; text-underline-offset:3px; padding:0; font-size:12.5px; }
/* tree panels */
.panels{ display:grid; gap:18px; }
.panel{ background:var(--card); border:1px solid var(--line); border-radius:12px; overflow:hidden; position:relative; }
.panel-h{ display:flex; align-items:baseline; gap:12px; padding:16px 22px 4px; flex-wrap:wrap; }
.panel-h h2{ font-size:17px; margin:0; font-weight:700; }
.panel-h .sub{ color:var(--mute); font-size:13.5px; }
.btn{ border:1px solid var(--line); background:var(--card); border-radius:8px; padding:7px 13px; font-size:13.5px; font-weight:500; }
.btn:hover{ border-color:var(--accent); }
.btn.pri{ background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
.tree-wrap{ position:relative; overflow:auto; padding:14px 22px 70px; }
.tree-inner{ position:relative; transform-origin:0 0; }
.tree-svg{ position:absolute; inset:0; overflow:visible; pointer-events:none; }
.col-label{ position:absolute; font-size:12.5px; color:var(--mute); font-weight:600; }
.node{ position:absolute; width:196px; height:94px; background:var(--card); border:1px solid var(--line); border-radius:8px; padding:9px 12px 8px 15px; cursor:pointer; text-align:left; overflow:hidden; }
.node::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--flat); }
.node.bad::before{ background:var(--bad); } .node.good::before{ background:var(--good); }
.node:hover{ border-color:var(--accent); box-shadow:0 2px 10px rgba(29,35,64,.10); }
.node.picked{ box-shadow:0 0 0 3px var(--orange); }
.node.ref{ border-style:dashed; background:var(--grey-card); }
.node .n{ font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; padding-right:16px; }
.node .val{ font-size:21px; font-weight:700; letter-spacing:-.015em; margin-top:1px; }
.node .val small{ font-size:11.5px; color:var(--mute); font-weight:500; margin-left:3px; }
.node .ft{ display:flex; justify-content:space-between; align-items:center; font-size:11.5px; color:var(--mute); margin-top:3px; gap:4px; white-space:nowrap; }
.node .ft span:first-child{ overflow:hidden; text-overflow:ellipsis; }
.dchip{ border-radius:4px; padding:1px 6px; font-weight:600; font-size:11.5px; white-space:nowrap; }
.dchip.bad{ background:var(--bad-soft); color:var(--bad); } .dchip.good{ background:var(--good-soft); color:var(--good); } .dchip.flat{ background:var(--flat-soft); color:var(--mute); }
.node.off{ background:repeating-linear-gradient(135deg,var(--grey-card) 0 7px, var(--card) 7px 14px); cursor:default; }
.node.off::before{ background:var(--line); }
.node.off .val{ font-size:12px; color:var(--mute); font-weight:500; margin-top:8px; line-height:1.35; }
.node .ext{ position:absolute; right:8px; top:8px; width:16px; height:16px; color:var(--accent); }
.op{ position:absolute; width:20px; height:20px; border-radius:50%; background:var(--card); border:1px solid var(--line); display:grid; place-items:center; font-size:12.5px; color:var(--mute); font-weight:700; line-height:1; }
.tog{ position:absolute; height:22px; min-width:22px; padding:0 6px; border-radius:11px; background:var(--card); border:1px solid var(--line); font-size:11.5px; font-weight:700; color:var(--accent-ink); display:grid; place-items:center; }
.tog:hover{ border-color:var(--accent); }
.edge-note{ position:absolute; font-size:11.5px; color:var(--mute); }
.panel-h .fs{ margin-left:auto; }
.panel.full{ position:fixed; inset:0; z-index:45; border-radius:0; border:0; display:flex; flex-direction:column; padding-top:env(safe-area-inset-top,0px); }
.panel.full .tree-wrap{ flex:1; overflow:auto; }
.zoom{ position:absolute; right:16px; bottom:14px; display:flex; align-items:center; gap:2px; background:var(--card); border:1px solid var(--line); border-radius:9px; padding:3px; z-index:2; }
.zoom button{ border:0; background:none; padding:6px 10px; border-radius:6px; font-size:13px; }
.zoom button:hover{ background:var(--grey-card); }
.zoom span{ color:var(--mute); font-size:12.5px; min-width:42px; text-align:center; }
.zoom i{ width:1px; height:18px; background:var(--line); margin:0 3px; }
/* lower */
.lower{ display:grid; grid-template-columns:1.25fr 1fr; gap:18px; margin-top:18px; }
.box{ background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px 22px; }
.box h3{ margin:0; font-size:17px; font-weight:700; }
.box .sub{ color:var(--mute); font-size:13.5px; margin:3px 0 14px; }
.box-h{ display:flex; align-items:flex-start; gap:12px; justify-content:space-between; flex-wrap:wrap; }
.bridge-row{ display:grid; grid-template-columns:minmax(170px,250px) 1fr 64px; align-items:center; gap:12px; padding:5px 0; }
.bridge-row .lbl{ font-size:14px; display:flex; gap:6px; align-items:center; }
.bridge-row .lbl button{ border:0; background:none; padding:0; width:18px; color:var(--accent-ink); font-weight:700; }
.bridge-row.tot .lbl{ font-weight:700; }
.bar-track{ position:relative; height:18px; }
.bar{ position:absolute; top:0; height:18px; border-radius:3px; }
.bar.tot{ background:var(--tot); } .bar.neg{ background:var(--bad); } .bar.pos{ background:var(--good); }
.bridge-row .num{ text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
.sub-rows{ padding:2px 0 8px 26px; border-left:2px solid var(--line-2); margin-left:8px; }
.sub-rows div{ display:flex; justify-content:space-between; font-size:13px; color:var(--mute); padding:2px 0; }
.check{ border-top:1px solid var(--line); margin-top:12px; padding-top:12px; color:var(--mute); font-size:13px; }
.plain{ font-size:14.5px; margin:0 0 14px; }
.alert-li{ display:grid; grid-template-columns:12px 1fr auto; gap:10px; padding:12px 0; border-bottom:1px solid var(--line-2); cursor:pointer; }
.alert-li:last-child{ border-bottom:0; }
.dot{ width:9px; height:9px; border-radius:50%; margin-top:7px; background:var(--bad); }
.dot.amber{ background:var(--amber); } .dot.grey{ background:var(--flat); }
.alert-li .tt{ font-weight:600; font-size:14px; }
.tags{ display:flex; gap:8px; margin-top:5px; flex-wrap:wrap; align-items:center; font-size:12.5px; color:var(--mute); }
.tag{ border-radius:5px; padding:1px 8px; font-size:12px; font-weight:600; background:var(--grey-card); color:var(--ink); }
.tag.open{ background:var(--bad-soft); color:var(--bad); } .tag.ack{ background:var(--amber-soft); color:var(--amber); } .tag.closed{ background:var(--good-soft); color:var(--good); } .tag.rev{ background:var(--accent-soft); color:var(--accent-ink); }
.imp{ text-align:right; white-space:nowrap; } .imp b{ display:block; font-size:15px; } .imp span{ color:var(--mute); font-size:12px; }
/* drawer */
.drawer{ position:fixed; top:0; right:0; bottom:0; width:min(500px,100%); background:var(--card); border-left:1px solid var(--line); z-index:50; transform:translateX(102%); transition:transform .22s ease; display:flex; flex-direction:column; box-shadow:-12px 0 40px rgba(28,24,56,.14); }
.drawer.open{ transform:none; }
.drawer-h{ padding:calc(20px + env(safe-area-inset-top,0px)) 24px 14px; border-bottom:1px solid var(--line-2); display:flex; gap:10px; align-items:flex-start; }
.drawer-h h3{ margin:0; font-size:20px; }
.drawer-h .x{ margin-left:auto; border:0; background:var(--grey-card); width:32px; height:32px; border-radius:8px; font-size:18px; flex:none; }
.drawer-b{ overflow:auto; padding:18px 24px calc(30px + env(safe-area-inset-bottom,0px)); }
.bigv{ font-size:34px; font-weight:700; letter-spacing:-.02em; }
.h4{ font-weight:700; font-size:14px; margin:22px 0 6px; }
.read{ background:var(--sky); color:var(--ink); border-radius:8px; padding:12px 14px; font-size:14px; }
.read b{ color:var(--accent-ink); }
.para{ margin:0 0 6px; font-size:14px; }
.askq{ border-left:3px solid var(--orange); padding:4px 0 4px 12px; font-size:14px; color:var(--ink); }
.dl{ display:grid; grid-template-columns:100px 1fr; gap:5px 12px; font-size:13px; margin:10px 0 0; color:var(--mute); }
.dl dt{ color:var(--mute); } .dl dd{ margin:0; color:var(--ink); }
table.t{ width:100%; border-collapse:collapse; font-size:13.5px; font-variant-numeric:tabular-nums; }
table.t th{ text-align:right; color:var(--mute); font-weight:500; padding:7px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
table.t th:first-child, table.t td:first-child{ text-align:left; }
table.t td{ text-align:right; padding:8px; border-bottom:1px solid var(--line-2); }
table.t tr.click{ cursor:pointer; } table.t tr.click:hover td{ background:var(--grey-card); }
table.t tr.total td{ font-weight:700; border-top:1px solid var(--line); }
.tw{ overflow-x:auto; }
.splits{ display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; }
.splits button{ border:1px solid var(--line); background:var(--card); border-radius:6px; padding:4px 11px; font-size:12.5px; }
.splits button.on{ background:var(--accent); color:#fff; border-color:var(--accent); }
.scrim{ position:fixed; inset:0; background:rgba(20,16,44,.3); z-index:40; display:none; }
.scrim.on{ display:block; }
/* page headings */
.ph{ margin:0 0 20px; } .ph h2{ font-size:27px; margin:0 0 6px; font-weight:700; letter-spacing:-.02em; } .ph p{ color:var(--mute); margin:0; max-width:760px; font-size:15px; }
/* overview */
.hero{ background:var(--card); border:1px solid var(--line); border-top:4px solid var(--orange); border-radius:14px; padding:28px 30px 26px; margin-bottom:22px; position:relative; overflow:hidden; }
.hero .when{ font-size:13.5px; color:var(--mute); font-weight:600; margin-bottom:6px; }
.hero h2{ font-size:30px; line-height:1.25; margin:0 0 10px; font-weight:700; letter-spacing:-.02em; }
.hero p{ font-size:16px; margin:0; }
.hero-stats{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:0; margin-top:22px; }
.hero-stats div{ border-left:2px solid var(--orange); padding:0 26px 0 14px; margin-bottom:8px; }
.hero-stats b{ display:block; font-size:28px; font-weight:700; letter-spacing:-.02em; }
.hero-stats span{ font-size:13px; color:var(--ink); }
.ov-sec{ display:grid; grid-template-columns:280px 1fr; gap:28px; padding:26px 0; border-top:1px solid var(--line); }
.ov-sec h3{ font-size:19px; margin:0 0 6px; line-height:1.3; }
.ov-sec .side-note{ color:var(--mute); font-size:13.5px; }
.walk{ display:grid; grid-template-columns:200px 1fr 92px; gap:6px 14px; align-items:center; font-size:14px; }
.walk .wl{ } .walk .wl small{ display:block; color:var(--mute); font-size:12px; }
.walk .wb{ position:relative; height:24px; }
.walk .wb div{ position:absolute; top:3px; height:18px; border-radius:3px; }
.walk .wv{ text-align:right; font-weight:700; font-variant-numeric:tabular-nums; }
.walk .tot .wl{ font-weight:700; }
.eq{ display:flex; flex-wrap:wrap; align-items:stretch; gap:10px; margin:6px 0 14px; }
.eq .t{ background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-width:150px; cursor:pointer; text-align:left; }
.eq .t:hover{ border-color:var(--accent); }
.eq .t b{ display:block; font-size:21px; } .eq .t span{ font-size:12.5px; color:var(--mute); }
.eq .o{ align-self:center; font-size:20px; color:var(--mute); font-weight:700; }

    const c={corp:othT*OX.corp, corpDa:0, nci:h.nci*w, taxRate:h.tax/((h.rev-h.cogs-h.emp-h.oth)-h.da-h.finN), leases:tot*LEASE_PCT, addback:0, capHub:0, equity:1000, shares:13.3,

  for(const ver of ['actual','budget']) for(let t=0;t<24;t++){ let siteT=0,daT=0; for(const id in D.row[ver][t]){ siteT+=D.row[ver][t][id].site; daT+=D.row[ver][t][id].da; }

})();

// ----- lens & aggregation -----
function rowMatch(r,L){ return (!L.div||r.div===L.div)&&(!L.st||r.st===L.st)&&(!L.reg||r.reg===L.reg); }

// scenario hooks (row level, relative unless noted): vol, won(pts of samples), price, real(pts), prod, cphL, supProd, cphS, consPS, sites, costSite, assets, daRate(pts)
function getRow(ver,t,r,sc){ const v=D.row[ver][t]&&D.row[ver][t][r.id]; if(!v) return null; if(!sc||ver!=='actual') return v;
  const g=k=>sc[k]||0; const o={...v};
  const ex=v.samples*(1-v.won)*(1+g('vol')), wn=v.samples*v.won+v.samples*g('won');
  o.samples=ex+wn; o.won=wn/o.samples; const k=o.samples/v.samples;

  o.sites=v.sites*(1+g('sites')); o.site=v.site*(1+g('sites'))*(1+g('costSite')); o.cap=v.cap*(1+g('sites')); o.util=o.samples/o.cap;
  const rate=v.da/v.assets; o.assets=v.assets*(1+g('assets')); o.da=o.assets*(rate+g('daRate')/12);
  o.labHc=v.labHc*k/(1+g('prod')); o.supHc=v.supHc*k/(1+g('supProd'));
  o.cphL=o.lab/o.labHc; o.cphS=o.sup/o.supHc;
  o.ebitda=o.rev-o.lab-o.sup-o.cons-o.site-o.comm;

function aggregate(L,P,ver,sc){

  for(let t=P.s;t<=P.e;t++){ if(!D.row[ver][t]) return null;

  S.staff=S.lab+S.sup; S.ocost=S.cons+S.site+S.comm; S.commRate=S.rev? S.comm/S.rev:null; S.grossM=S.rev? (S.rev-S.cons)/S.rev:null; S.segEbitda=S.rev-S.staff-S.ocost; S.segEbit=S.segEbitda-S.segDa;
  S.existing=S.samples-S.won; S.samplesK=S.samples*1e4; S.capK=S.cap*1e4; S.existingK=S.existing*1e4; S.wonK=S.won*1e4;
  S.price=S.samples? S.owed/S.samples:null; S.revPS=S.samples? S.rev/S.samples:null;
  S.real=S.owed? S.rev/S.owed:null; S.util=S.cap? S.samples/S.cap:null;
  S.labHc=S.labHm/n; S.supHc=S.supHm/n; S.hc=S.labHc+S.supHc;
  S.prod=S.labHm? S.samples*1e7/S.labHm:null; S.supProd=S.supHm? S.samples*1e7/S.supHm:null;
  S.cphL=S.labHm? S.lab/S.labHm*12*100:null; S.cphS=S.supHm? S.sup/S.supHm*12*100:null;   // ₹ lakh a year

  S.sites=S.sitesM/n; S.costSite=S.sitesM? S.site/S.sitesM*12:null;                     // A$k a year per site

  if(lv.co){ let corp=0,corpDa=0,fin=0,nci=0,tax=0,leases=0,addback=0,capBase=0,capHub=0,finLease=0,div=0,acq=0,eq=0,other=0,owc=0,recvChg=0,payChg=0,avgND=0,pbt=0,ebitdaC=0,oneoff=0,treas=0,intTax=0,fcfgS=0,ndRed=0;
    let dND=0, dCap=0; const ndStart=D.co[ver][P.s].ndOpen;
    for(let t=P.s;t<=P.e;t++){ const c=D.co[ver][t]; const B=D.row[ver][t];
      let revB=0,revS=0,se=0,daRow=0,ncost=0,ncostB=0,ebB=0,daB=0;

      const opexA=(revB-(ebB-c.corp+c.corpDa))*12, opexP=t>0? (aggSimpleRev(t-1,ver)-(aggEb(t-1,ver)-D.co[ver][t-1].corp+D.co[ver][t-1].corpDa))*12 : opexA;
      const pay=DPO(t)*opexA/365, payPrev=DPO(Math.max(0,t-1))*opexP/365;
      const rC=recvB-recvPrev, pC=pay-payPrev, oC=c.nwc-rC+pC;
      const relDso=G('dso')*revL/365/n, relDpo=G('dpo')*opexA/365/n, oAdj=G('owc')/n;

      const adjM=ebitdaM-leaseM+c.addback; const fcfgM=adjM-wcM;
      const leaseInt=c.leases*(t<12? 13.9/107.5 : 15.2/117.3);
      const oneM=c.oneoff*(1+G('oneoff')), trM=c.treas*(1+G('treas'));
      const divM=c.div*(1+G('div')), acqM=c.acq+G('acq')/n, eqM=c.eq+G('eq')/n;
      const itM=(f-leaseInt)+taxM;
      // base case and the balancing item (currency on net debt, asset sales, timing) so base net debt follows the reported path
      let ndRedB; { const pbtB=ebB-daB-c.corp-c.fin; const taxB=Math.max(0,pbtB)*c.taxRate; const fcfgB=(ebB-c.corp+c.corpDa)-c.leases+c.addback-c.nwc;
        ndRedB=fcfgB-(c.capBase+c.capHub)-c.oneoff-c.acq-c.div-c.treas-((c.fin-leaseInt)+taxB)+c.eq; }

      corp+=corpM; corpDa+=c.corpDa+daAdj; fin+=f; tax+=taxM; nci+=nciM; pbt+=pbtM; leases+=leaseM; addback+=c.addback; capBase+=capB; capHub+=capH; finLease+=leaseInt;
      div+=divM; acq+=acqM; eq+=eqM; other+=fxoM; recvChg+=rC-relDso; payChg+=pC+relDpo; owc+=oC+oAdj; avgND+=avg; ebitdaC+=ebitdaM; oneoff+=oneM; treas+=trM; intTax+=itM; fcfgS+=fcfgM; ndRed+=ndRedM; }

function aggCost(t,ver){ let x=0; for(const r of ROWS){ const v=D.row[ver][t][r.id]; x+=v.cons+v.site; } return x; }
const _revCache={};

// ---------- formatting ----------
function num(v,dp){ if(v==null||!isFinite(v)) return '–'; const s=Math.abs(v).toLocaleString('en-IN',{minimumFractionDigits:dp,maximumFractionDigits:dp}); return (v<0?MINUS:'')+s; }
function am(v,dp){ if(v==null||!isFinite(v)) return '–'; const a=Math.abs(v); dp=dp==null?(a>=100?0:1):dp; return (v<0?MINUS:'')+'₹'+num(a,dp)+' Cr'; }
function fvt(u,v){ return u==='m'? am(v) : fv(u,v).m; }
function ad(v,dp){ if(v==null||!isFinite(v)) return '–'; return (v<0?MINUS:'')+'₹'+num(Math.abs(v),dp==null?1:dp); }
function fv(u,v){ if(v==null||!isFinite(v)) return {m:'–',s:''};
  switch(u){ case 'm': return {m:am(v),s:''}; case 'ks': return Math.abs(v)>=999.5? {m:num(v/1000,2)+'M',s:''} : {m:num(v,0)+'k',s:''}; case 'aud': return {m:ad(v,1),s:''};
   case 'pct': return {m:num(v*100,1)+'%',s:''}; case 'days': return {m:num(v,0),s:'days'}; case 'x': return {m:num(v,1)+'x',s:''}; case 'hc': return {m:num(v,0),s:''};
   case 'spm': return {m:num(v,0),s:'a month'}; case 'aud2': return {m:ad(v,2),s:''}; case 'n': return {m:num(v,0),s:''}; case 'pct2': return {m:num(v*100,2)+'%',s:''}; case 'kaud': return {m:'₹'+num(v,1)+' lakh',s:'a year'}; case 'cps': return {m:num(v,1)+'c',s:''}; }
  return {m:num(v,1),s:''}; }
function fvs(u,v){ const x=fv(u,v); if(u==='m') return am(v); if(u==='ks') return x.m+' pieces'; if(u==='hc') return x.m+' people'; return x.s? x.m+' '+x.s : x.m; }
const DP={m:1,ks:0,aud:1,aud2:2,n:0,days:0,x:1,hc:0,spm:0,kaud:1,cps:1};
function delta(u,a,b,dir){ if(a==null||b==null||!isFinite(a)||!isFinite(b)) return {txt:'',pc:'',cls:'flat'};
  const d=a-b; let txt,pc='',zero;
  if(u==='pct'||u==='pct2'){ const dp2=u==='pct2'?2:1; zero=Math.abs(d)<0.5*Math.pow(10,-dp2)/100; txt=(zero?'':(d>=0?'+':MINUS))+num(Math.abs(d*100),dp2)+' pts'; }
  else { const dp=DP[u]==null?1:DP[u]; zero=Math.abs(d)<0.5*Math.pow(10,-dp); txt=zero? num(0,dp) : (d>=0?'+':MINUS)+(u==='m'? am(Math.abs(d)) : num(Math.abs(d),dp));
    if(u==='aud'||u==='aud2') txt=zero? '₹0': (d>=0?'+':MINUS)+'₹'+num(Math.abs(d),u==='aud2'?2:1); if(u==='kaud') txt=zero?'₹0':(d>=0?'+':MINUS)+'₹'+num(Math.abs(d),1)+' lakh';
    if(!zero && !(Math.abs(b)<1e-9 || (a<0)!==(b<0) || b<0)) pc=(d>=0?'+':MINUS)+num(Math.abs(d/b*100),1)+'%'; }
  const cls= zero? 'flat' : (d*dir>0?'good':'bad');
  return {txt,pc,cls,d}; }
// one change number per box: % for money and counts, absolute for ratios
function chip(u,dl){ if(!dl.txt) return ''; if(['m','ks','hc'].includes(u)&&dl.pc) return dl.pc; if(u==='m'&&dl.d!=null){ if(dl.cls==='flat') return '0'; const a=Math.abs(dl.d); return (dl.d>=0?'+':MINUS)+am(a,a>=100?0:1); } return dl.txt.replace(' pts',' pts'); }

function spark(fn){ const pts=[]; const e=P0().e; for(let i=Math.max(0,e-11);i<=e;i++){ const S=vals(state.L,{s:i,e:i},'actual'); const v=S?fn(S):null; if(v!=null&&isFinite(v)) pts.push(v); }
  if(pts.length<2) return ''; const mn=Math.min(...pts),mx=Math.max(...pts),r=mx-mn||1; const w=160,h=20;
  const d=pts.map((v,i)=>`${(i/(pts.length-1)*w).toFixed(1)},${(h-(v-mn)/r*h+2).toFixed(1)}`).join(' ');

// ---------- tree layout & render ----------

function treeOf(id){ for(const k in TREES){ const def=TREES[k]; if(def.ch[id]||def.roots.find(r=>r.id===id)) return k; for(const kids of Object.values(def.ch)) if(kids.find(c=>c[0]===id)) return k; } return 'pat'; }

// ---------- bridge (to underlying EBIT, or stream EBIT when filtered) ----------
function bridge(L,P,mode,sc){ const lv=lensLevel(L); let BP, bver='actual', bsc=null;
  if(sc){ BP=P; } else if(mode==='budget'){ BP=P; bver='budget'; if(P.s<18) return null; } else { BP=cmpPer(P,mode); if(!BP) return null; }
  const keys=['vol','price','bill','cons','comm','lab','sup','site','da']; const steps={}; keys.forEach(k=>steps[k]={v:0,by:{}});
  const add=(k,p,v)=>{ steps[k].v+=v; steps[k].by[p]=(steps[k].by[p]||0)+v; };
  for(let i=0;i<=P.e-P.s;i++){ const ta=P.s+i, tb=BP.s+i;
    for(const r of ROWS){ if(!rowMatch(r,L)) continue; const a=getRow('actual',ta,r,sc), b=getRow(bver,tb,r,bsc); if(!a||!b) continue;
      add('vol',r.id,(a.samples-b.samples)*b.price*b.real); add('price',r.id,a.samples*(a.price-b.price)*b.real); add('bill',r.id,a.samples*a.price*(a.real-b.real));
      add('lab',r.id,-(a.lab-b.lab)); add('sup',r.id,-(a.sup-b.sup)); add('cons',r.id,-(a.cons-b.cons)); add('comm',r.id,-(a.comm-b.comm)); add('site',r.id,-(a.site-b.site)); add('da',r.id,-(a.da-b.da)); } }
  const SA=vals(L,P,'actual',sc), SB=vals(L,BP,bver);
  const lab={vol:'Pieces sold',price:'List price and mix',bill:'Share of tag price kept',cons:'Product cost',comm:'Channel commissions',lab:'Store and logistics services',sup:'Employees',site:'Stores and overheads',da:'Depreciation'};
  const out=keys.map(k=>({k,l:lab[k],v:steps[k].v,by:steps[k].by}));
  out.splice(out.findIndex(x=>x.k==='da'),1);
  let metric='brand EBITDA', a=SA.segEbitda, b=SB.segEbitda;
  if(lv.co){ out.push({k:'corp',l:'Royalty and ad spend',v:-(SA.corp-SB.corp),by:{}}); metric='EBITDA'; a=SA.ebitda; b=SB.ebitda; }
  return {metric,a,b,steps:out}; }
const PHR={vol:['fewer pieces sold','more pieces sold'],price:['lower prices and mix','higher prices and mix'],bill:['deeper discounts','fewer discounts'],cons:['higher product costs','lower product costs'],comm:['higher commissions','lower commissions'],lab:['higher store and logistics costs','lower store and logistics costs'],sup:['higher employee costs','lower employee costs'],site:['higher store costs','lower store costs'],da:['higher depreciation','lower depreciation'],corp:['more royalty and ad spend','less royalty and ad spend']};
function cap1(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function bridgeSummary(br,lbl){ if(!br) return ''; const gap=br.a-br.b; const M=cap1(br.metric);
  const dir=gap<0?'below':'above'; const main=br.steps.filter(s=>Math.sign(s.v)===Math.sign(gap)&&Math.abs(s.v)>0.05).sort((x,y)=>Math.abs(y.v)-Math.abs(x.v)).slice(0,3);
  if(Math.abs(gap)<0.05) return `${M} was in line with ${lbl}.`;
  const parts=main.map(s=>`${PHR[s.k][s.v<0?0:1]} (${s.v<0?MINUS:'+'}${am(Math.abs(s.v))})`);
  const list=parts.length>2? parts.slice(0,-1).join('; ')+'; and '+parts[parts.length-1] : parts.join(' and ');
  return `${M} was ${am(Math.abs(gap))} ${dir} ${lbl}. The biggest contributors: ${list}.`; }
function bridgeBox(){ const L=state.L; const br=bridge(L,P0(),state.cmp,state.treeSc); const lbl=cmpLabel();

  const pts=[br.b]; let run=br.b; br.steps.forEach(s=>{ run+=s.v; pts.push(run); }); pts.push(br.a);
  const lo=Math.min(0,...pts), hi=Math.max(...pts); const X=v=>((v-lo)/(hi-lo)*100);
  // zoomed scale so the steps are visible: start the axis below the lowest running total
  const lo2=Math.min(...pts)-(hi-Math.min(...pts))*0.9; const X2=v=>((v-lo2)/(hi-lo2)*100);

   <div class="check">+ shows the split by brand and channel. Lines add to ${sum>=0?'+':MINUS}${num(Math.abs(sum),1)}. Gap ${num(br.b,1)} to ${num(br.a,1)} is ${br.a-br.b>=0?'+':MINUS}${num(Math.abs(br.a-br.b),1)}.</div></div>`; }

function trendSVG(meta){ const pts=[], bud=[]; const e=P0().e; const t0=Math.max(0,e-11);
  for(let i=t0;i<=e;i++){ const A=vals(state.L,{s:i,e:i},'actual'), B=vals(state.L,{s:i,e:i},'budget'); pts.push(A&&(meta.g==='row'||A.valid.co)?meta.v(A):null); bud.push(B&&(meta.g==='row'||B.valid.co)?meta.v(B):null); }
  const all=[...pts,...bud].filter(v=>v!=null&&isFinite(v)); if(all.length<2) return '';
  const mn=Math.min(...all), mx=Math.max(...all), r=(mx-mn)||1, w=420, h=120, n=pts.length;
  const P=arr=>arr.map((v,i)=>v==null?null:`${(i/(n-1)*(w-20)+10).toFixed(1)},${(h-14-(v-mn)/r*(h-34)).toFixed(1)}`).filter(Boolean).join(' ');
  const labs=[t0,e].map((i,j)=>`<text x="${j?w-10:10}" y="${h+2}" font-size="11" fill="var(--mute)" text-anchor="${j?'end':'start'}">${MONTHS[i].label}</text>`).join('');
  const hasB=bud.some(v=>v!=null);
  return `<svg viewBox="0 0 ${w} ${h+6}" style="width:100%;height:auto">${hasB?`<polyline points="${P(bud)}" fill="none" stroke="var(--mute)" stroke-dasharray="4 4" stroke-width="1.4"/>`:''}<polyline points="${P(pts)}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>${labs}<line x1="${w-170}" y1="8" x2="${w-150}" y2="8" stroke="var(--accent)" stroke-width="2.2"/><text x="${w-145}" y="12" font-size="11" fill="var(--mute)">Actual</text>${hasB?`<line x1="${w-90}" y1="8" x2="${w-70}" y2="8" stroke="var(--mute)" stroke-dasharray="4 4" stroke-width="1.4"/><text x="${w-65}" y="12" font-size="11" fill="var(--mute)">Plan</text>`:''}</svg>`; }
function splitDims(meta){ if(meta.g==='row') return [['st','Brand'],['reg','Channel'],['div','Brand group']]; return []; }
function dimValues(dim){ const L=state.L; if(dim==='st') return STREAMS.filter(s=>(!L.div||s.d===L.div)&&(!L.st||s.k===L.st)).map(s=>[s.k,s.l]); if(dim==='reg') return REGIONS.filter(r=>!L.reg||r.k===L.reg).map(r=>[r.k,RG_S[r.k]]); return DIVS.filter(d=>!L.div||d.k===L.div).map(d=>[d.k,d.l]); }
let splitDim='st';
function openNode(id){ state.sel=id; const meta=nd(id); const S=curS(), C=cmpS(); const lv=S.valid;
  const valid= meta.g==='row'||lv.co;
  const grainTxt= meta.g==='row'? 'By brand and channel' : 'Company level';
  $('#dTitle').innerHTML=`<h3>${esc(meta.l)}</h3><div class="tags"><span class="tag rev">${grainTxt}</span><span class="tag">${esc(perName(P0()))}</span>${lensText()?`<span class="tag">${esc(lensText())}</span>`:''}</div>`;
  let h='';
  if(!valid){ h+=`<p class="read">Held for the Group only, so there is no figure for <b>${esc(lensText())}</b>.</p>`; }
  else { const a=meta.v(S), b=C?meta.v(C):null; const dl=delta(meta.u,a,b,meta.dir);
    h+=`<div class="bigv">${fvs(meta.u,a)}</div><div class="cmpline">${esc(cmpLabel())} ${b!=null?fvs(meta.u,b):'not available'} ${dl.txt?`<span class="dchip ${dl.cls}">${dl.txt}</span>`:''}${dl.pc&&meta.u!=='pct'?`<span class="dchip ${dl.cls}">${dl.pc}</span>`:''}</div>`;
    h+=`<div class="read" style="margin-top:12px">${readFor(id,meta,S,C)}</div>`; }
  h+=`<dl class="dl"><dt>Formula</dt><dd>${esc(meta.f)}</dd><dt>Owner</dt><dd>${esc(meta.o)}</dd><dt>Source</dt><dd>${esc(meta.s)}</dd></dl>`;
  if(valid){ h+=`<div class="h4">Last 12 months, by month</div>${trendSVG(meta)}`; }
  const dims=splitDims(meta);
  if(valid && dims.length){ if(!dims.find(d=>d[0]===splitDim)) splitDim=dims[0][0];
    const vs=dimValues(splitDim); const additive=['m','ks','hc'].includes(meta.u);
    let rows=vs.map(([k,l])=>{ const L2={...state.L,[splitDim]:k}; if(splitDim==='st') L2.div=STREAM_BY[k].d; if(splitDim==='div'&&L2.st&&STREAM_BY[L2.st].d!==k) return null;
      const a=vals(L2,P0(),'actual',state.treeSc); if(!a||a.rev<1e-6) return null; const b=state.treeSc? vals(L2,P0(),'actual') : cmpOf(L2,P0()); const av=meta.v(a), bv=b?meta.v(b):null; const dl=delta(meta.u,av,bv,meta.dir); return {k,l,av,bv,dl}; }).filter(Boolean);
    rows.sort((x,y)=> additive? Math.abs(y.av)-Math.abs(x.av) : y.av-x.av);
    h+=`<div class="h4">Split</div><div class="splits">${dims.map(([k,l])=>`<button data-sd="${k}" class="${k===splitDim?'on':''}">${l}</button>`).join('')}</div>
     <div class="tw"><table class="t"><thead><tr><th>${dims.find(d=>d[0]===splitDim)[1]}</th><th>Actual</th><th>${esc(cmpLabel())}</th><th>Change</th></tr></thead><tbody>${rows.map(r=>`<tr class="click" data-lk="${r.k}"><td>${esc(r.l)}</td><td>${fvt(meta.u,r.av)}</td><td>${r.bv!=null?fvt(meta.u,r.bv):'–'}</td><td><span class="dchip ${r.dl.cls}">${chip(meta.u,r.dl)||'–'}</span></td></tr>`).join('')}
     ${additive?`<tr class="total"><td>Total</td><td>${fvt(meta.u,meta.v(S))}</td><td>${C?fvt(meta.u,meta.v(C)):'–'}</td><td></td></tr>`:''}</tbody></table></div><div class="hint">Click a row to filter the tree.</div>`; }
  $('#dBody').innerHTML=h; $('#drawer').classList.add('open'); $('#scrim').classList.add('on');
  $('#dBody').querySelectorAll('[data-sd]').forEach(b=>b.onclick=()=>{ splitDim=b.dataset.sd; openNode(id); });
  $('#dBody').querySelectorAll('[data-lk]').forEach(tr=>tr.onclick=()=>{ const k=tr.dataset.lk; state.L[splitDim]=k; if(splitDim==='st') state.L.div=STREAM_BY[k].d; closeDrawer(); state.view='tree'; renderAll(); });
  document.querySelectorAll('.node.picked').forEach(n=>n.classList.remove('picked')); document.querySelectorAll(`.node[data-node="${id}"]`).forEach(n=>n.classList.add('picked')); }
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#scrim').classList.remove('on'); state.sel=null; document.querySelectorAll('.node.picked').forEach(n=>n.classList.remove('picked')); }
function readFor(id,meta,S,C){ if(!C) return 'No comparison figures for this period.';
  const a=meta.v(S), b=meta.v(C); const dl=delta(meta.u,a,b,meta.dir); const word= dl.cls==='flat'? 'In line with' : (dl.cls==='good'?'Better than':'Worse than');
  let s=`<b>${word} ${esc(cmpWord())}</b>: ${fvs(meta.u,a)} against ${fvs(meta.u,b)}${meta.u==='pct'&&Math.abs(a-b)>=0.0005?`, ${num(Math.abs(a-b)*100,1)} percentage points ${a>b?'higher':'lower'}`:''}. `;
  if(['ebit','pat','segEbitda'].includes(id)){ const br=bridge(state.L,P0(),state.cmp,state.treeSc); if(br){ s+=bridgeSummary(br,cmpWord()).replace(/^[^.]*\. /,''); if(id==='pat'&&S.valid.co) s+=` Net interest moved by ${am(S.fin-C.fin)} and tax by ${am(S.tax-C.tax)}.`; } return s; }
  const dims=splitDims(meta); if(!dims.length) return s+'Group-level figure, so there is no split below it.';
  const by=ROWS.filter(r=>rowMatch(r,state.L)).map(r=>({l:ROW_L[r.id],L2:{div:null,st:r.st,reg:r.reg}}));
  if(by.length<2) return s+'One brand and channel is selected, so there is nothing further to split.';
  const parts=by.map(o=>{ const x=vals(o.L2,P0(),'actual',state.treeSc), y=state.treeSc?vals(o.L2,P0(),'actual'):cmpOf(o.L2,P0()); if(!x||!y) return null; return {l:o.l,d:meta.v(x)-meta.v(y),a:meta.v(x)}; }).filter(Boolean);
  if(['m','ks','hc'].includes(meta.u)){ parts.sort((x,y)=>(x.d*meta.dir)-(y.d*meta.dir)); const worst=parts.slice(0,3).filter(x=>x.d*meta.dir<0);
    if(worst.length) s+=`Furthest behind: ${worst.map(x=>`${x.l} (${x.d>=0?'+':MINUS}${num(Math.abs(x.d),meta.u==='m'?1:0)})`).join(', ')}.`; else s+='No brand and channel is behind.'; }
  else { parts.sort((x,y)=>(x.a*meta.dir)-(y.a*meta.dir)); s+=`Weakest: ${parts.slice(0,3).map(x=>`${x.l} (${fvt(meta.u,x.a)})`).join(', ')}.`; }
  return s; }

function story(){ const P=P0(), pn=perName(P); const L=state.L; const lv=lensLevel(L); const S=vals(L,P,'actual'); const C=cmpOf(L,P); const lbl=cmpWord(); let h,k='';
  if(lv.co){ h=`Arvind Fashions made ${am(S.ebitda)} of EBITDA on ${am(S.rev)} of revenue in ${pn}, a ${num(S.ebitdaM*100,1)}% margin, with gross margin at ${num(S.grossM*100,1)}%.`;
    if(C){ const dE=S.ebitda-C.ebitda; k=`Against ${lbl}, EBITDA is ${am(Math.abs(dE))} ${dE>=0?'higher':'lower'}. Channel commissions took ${num(S.commRate*100,1)}% of revenue.`; } }
  else { const nm=lensText(); const dE=C? S.segEbitda-C.segEbitda:null; h=`${nm}: an estimated ${am(S.segEbitda)} of brand EBITDA in ${pn}, a ${num(S.segEbitdaM*100,1)}% margin.`; if(C) k=`${am(Math.abs(dE))} ${dE>=0?'more':'less'} than ${lbl}. Brand and channel figures are estimates; AFL does not report them.`; }
  return {h,k}; }

const LB=()=>vals({},P0(),'actual');
function levText(l,v){ if(!v) return 'No change'; const sg=v>0?'+':MINUS, a=Math.abs(v);
  if(l.type==='pct') return `${sg}${num(a*100,1)}%`; if(l.type==='pts'||l.type==='ptsS') return `${sg}${num(a*100,2)} pts`; if(l.type==='days') return `${sg}${num(a,0)} days`; return `${sg}₹${num(a,0)} Cr`; }
function levNow(l){ const m=N[l.node]; const S=LB(); if(!S||(m.g==='co'&&!S.valid.co)) return ''; return fvs(m.u,m.v(S)); }
function scFrom(o){ const s={}; for(const [k,v] of Object.entries(o)){ if(!v) continue; if(k==='dsoChg') s.dso=-v; else s[k]=v; } return Object.keys(s).length? s:null; }
function scObj(){ return scFrom(state.sc); }
const PRESETS=[
 {k:'p1',l:'Pay less in commissions',d:'Commission rate 5% lower, for example by paying partners a lower rate as their sales grow.',sc:{commRate:-.05}},
 {k:'p2',l:'Buy for less',d:'Each piece costs 2% less to buy, for example by using fewer suppliers with bigger orders.',sc:{consPS:-.02}},
 {k:'p3',l:'Discount less',d:'AFL keeps ₹1 more of every ₹100 of tag price.',sc:{real:.01}},
 {k:'p4',l:'Cheaper stores',d:'Store running costs and store rent both 5% lower.',sc:{costSite:-.05,leaseSite:-.05}},
 {k:'p5',l:'Hold less stock',d:'₹150 Cr less money tied up in unsold clothes.',sc:{owc:-150}},
 {k:'p6',l:'First four together',d:'Commissions, buying, discounts and stores together.',sc:{commRate:-.05,consPS:-.02,real:.01,costSite:-.05,leaseSite:-.05}}];
// value of a 1% improvement in each lever (relative to its current level)
function levImpacts(P){ const B=vals({},P,'actual'); return LEVERS.map(l=>{ const v=l.test!=null? l.test : .01*l.fav;
    const o={}; o[l.k]=v; const X=vals({},P,'actual',scFrom(o)); return {l,v,dPat:X.pat-B.pat,dNd:X.netDebt-B.netDebt,dEbit:X.ebit-B.ebit}; }); }
function viewSc(){ const sc=scObj(); const P=P0(); const B=vals({},P,'actual'), X=vals({},P,'actual',sc)||B;
  const card=(l,a,b,u,dir,extra)=>{ const dl=delta(u,a,b,dir); return `<div class="res"><div class="t">${l}</div><div class="v">${fvs(u,a)}</div><div class="d ${dl.cls}-t">${sc?(dl.txt||'No change')+' vs actual':'Actual '+fvs(u,b)}</div>${extra?`<div class="x">${extra}</div>`:''}</div>`; };
  const rows=[['rev','Revenue'],['grossM','Gross margin'],['comm','Channel commissions'],['segEbitda','Brand EBITDA'],['ebitda','EBITDA'],['ebitdaM','EBITDA margin'],['pat','Net profit to AFL'],['fcfg','Cash from trading'],['netDebt','Net debt at period end']];
  const preset=PRESETS.find(p=>p.k===state.preset); const saved=STORE.scen.find(s=>s.id===state.preset);
  const title= preset? preset.l : saved? saved.name : 'New scenario';
  const lib=PRESETS.map(p=>{ const Z=vals({},P,'actual',scFrom(p.sc)); const d=Z.pat-B.pat; const dc=-(Z.netDebt-B.netDebt); const useCash=Math.abs(d)<0.5; return `<button class="preset ${state.preset===p.k?'on':''}" data-ps="${p.k}"><span class="rd"></span><b>${p.l}</b><span>${p.d}</span><em class="${(useCash?dc:d)>=0?'good-t':'bad-t'}">${(useCash?dc:d)>=0?'+':MINUS}${am(Math.abs(useCash?dc:d),1)} ${useCash?'lower net debt':'net profit'}</em></button>`; }).join('')
   + STORE.scen.map(s=>`<div class="preset ${state.preset===s.id?'on':''}" data-ps="${s.id}" role="button" tabindex="0"><span class="rd"></span><b>${esc(s.name)}</b><span>${esc(scDesc(s.sc))}</span><em>Saved ${esc(s.date)} <button class="del" data-delsc="${s.id}" aria-label="Delete ${esc(s.name)}">Delete</button></em></div>`).join('');
  const canSave= sc && !preset && !saved; const moved=LEVERS.filter(l=>state.sc[l.k]).length;
  const groups=LGROUPS.map(g=>{ const ls=LEVERS.filter(l=>l.g===g); const n=ls.filter(l=>state.sc[l.k]).length; const open=state.lgOpen? state.lgOpen[g] : (g==='Revenue'||n>0);
    return `<details class="lg" data-lg="${esc(g)}" ${open?'open':''}><summary><span>${g}</span><em>${n? n+' moved':ls.length+' levers'}</em></summary>${ls.map(l=>`<div class="lever"><div class="lh"><label for="lv-${l.k}">${l.l} <small>now ${levNow(l)}</small></label><span id="lvv-${l.k}" class="${state.sc[l.k]? (Math.sign(state.sc[l.k])===l.fav?'good-t':'bad-t'):''}">${levText(l,state.sc[l.k])}</span></div><input type="range" id="lv-${l.k}" data-lv="${l.k}" min="${l.min}" max="${l.max}" step="${l.step}" value="${state.sc[l.k]}"></div>`).join('')}</details>`; }).join('');
  const dP=X.pat-B.pat;
  return `<div class="rp-top"><div class="ph" style="margin:0"><h2>Scenarios</h2><p>${esc(P.long)}. Each lever below is one of the starting points of the value tree (${LEVERS.length} in all). Move any of them to see how profit and debt would have changed over the period. Reported figures stay as reported; the effects are Aistra estimates.</p></div><button class="btn pri" id="scNew">New scenario</button></div>
   <div class="presets">${lib}</div>
   <div class="sc-grid"><div class="box"><div class="box-h"><div><h3>Levers</h3><div class="sub">${moved? moved+' moved':'Grouped as in the tree'}</div></div><button class="btn" id="scReset">Clear</button></div>${groups}
    <div class="savebar" ${canSave?'':'hidden'}><input id="scName" placeholder="Name this scenario" aria-label="Scenario name"><button class="btn pri" id="scSave">Save</button></div></div>
   <div class="box sc-res"><div class="box-h"><div><h3>${esc(title)}</h3><div class="sub">${sc?'Scenario against actual':'Move a lever or pick a scenario'}</div></div>${sc?'<button class="btn" id="scShow">Show on the tree</button>':''}</div>
    <div class="res-cards">${card('EBITDA',X.ebitda,B.ebitda,'m',1)}${card('EBITDA margin',X.ebitdaM,B.ebitdaM,'pct',1)}${card('Net profit to AFL',X.pat,B.pat,'m',1)}${card('Net debt at period end',X.netDebt,B.netDebt,'m',-1)}</div>
    <div class="tw"><table class="t"><thead><tr><th></th><th>Actual</th><th>Scenario</th><th>Change</th></tr></thead><tbody>${rows.map(([id,l])=>{ const m=N[id]; const a=m.v(X), b=m.v(B); const dl=delta(m.u,a,b,m.dir); return `<tr class="click" data-on="${id}"><td>${l}</td><td>${fvt(m.u,b)}</td><td>${fvt(m.u,a)}</td><td><span class="dchip ${dl.cls}">${chip(m.u,dl)||'–'}</span></td></tr>`; }).join('')}</tbody></table></div>
    ${sc&&Math.abs(dP)>.05?`<div class="read" style="margin-top:12px">EBITDA ${X.ebitda>=B.ebitda?'rises':'falls'} by ${am(Math.abs(X.ebitda-B.ebitda))} over ${esc(perName(P))}, net profit by ${am(Math.abs(dP))}, and net debt ${X.netDebt<=B.netDebt?'falls':'rises'} by ${am(Math.abs(X.netDebt-B.netDebt))}.</div>`:''}</div></div>`; }
function scDesc(o){ return LEVERS.filter(l=>o[l.k]).map(l=>`${l.l} ${levText(l,o[l.k])}`).join('; ')||'No levers moved'; }
function bindSc(){ const p=$('#page');
  p.querySelectorAll('[data-ps]').forEach(b=>{ b.onclick=e=>{ if(e.target.dataset.delsc) return; const k=b.dataset.ps; const pr=PRESETS.find(x=>x.k===k)||STORE.scen.find(x=>x.id===k); state.sc={...ZERO_SC(),...pr.sc}; state.preset=k; state.lgOpen=null; renderPage(); }; b.onkeydown=e=>{ if(e.key==='Enter') b.click(); }; });
  p.querySelectorAll('[data-delsc]').forEach(b=>b.onclick=e=>{ e.stopPropagation(); STORE.scen=STORE.scen.filter(s=>s.id!==b.dataset.delsc); saveStore(); if(state.preset===b.dataset.delsc){ state.preset=null; state.sc=ZERO_SC(); } renderPage(); });
  p.querySelectorAll('details.lg').forEach(d=>d.ontoggle=()=>{ state.lgOpen=state.lgOpen||Object.fromEntries([...p.querySelectorAll('details.lg')].map(x=>[x.dataset.lg,x.open])); state.lgOpen[d.dataset.lg]=d.open; });
  p.querySelectorAll('[data-lv]').forEach(inp=>{ const l=LEVERS.find(x=>x.k===inp.dataset.lv); inp.oninput=()=>{ state.sc[l.k]=+inp.value; state.preset=null; const el=$('#lvv-'+l.k); el.textContent=levText(l,+inp.value); };
    inp.onchange=()=>{ state.lgOpen=Object.fromEntries([...p.querySelectorAll('details.lg')].map(x=>[x.dataset.lg,x.open])); const y=window.scrollY; renderPage(); window.scrollTo(0,y); }; });
  const r=$('#scReset'); if(r) r.onclick=()=>{ state.sc=ZERO_SC(); state.preset=null; state.lgOpen=null; renderPage(); };
  const n=$('#scNew'); if(n) n.onclick=()=>{ state.sc=ZERO_SC(); state.preset=null; state.lgOpen=null; renderPage(); };
  const sv=$('#scSave'); if(sv) sv.onclick=()=>{ const name=($('#scName').value||'').trim()||`Scenario ${STORE.scen.length+1}`; const id='s'+Date.now(); STORE.scen.push({id,name,sc:Object.fromEntries(Object.entries(state.sc).filter(([k,v])=>v)),date:today()}); saveStore(); state.preset=id; renderPage(); };
  const s=$('#scShow'); if(s) s.onclick=()=>{ state.treeSc=scObj(); const pr=PRESETS.find(x=>x.k===state.preset)||STORE.scen.find(x=>x.id===state.preset); state.presetName=pr?(pr.l||pr.name):'New scenario'; state.L=EMPTY_L(); state.view='tree'; state.tab='pat'; renderAll(); window.scrollTo(0,0); };
  p.querySelectorAll('[data-on]').forEach(tr=>tr.onclick=()=>openNode(tr.dataset.on)); }

 {id:'R02',l:'Profit and loss',d:'Every line from revenue to net profit, against plan and last year',to:'CFO',when:'Monthly, working day 4',freq:'Monthly',st:'draft',r:'pl'},
 {id:'R03',l:'Brand and channel',d:'Revenue, EBITDA and margin for every category in every channel',to:'Business directors',when:'Monthly, working day 4',freq:'Monthly',st:'draft',r:'stream'},
 {id:'R04',l:'Gap to plan',d:'What explains the difference from plan, step by step',to:'CEO, CFO',when:'Monthly, working day 4',freq:'Monthly',st:'rev',r:'bridge'},

  return `<div class="rp-top"><div class="ph" style="margin:0"><h2>Reports</h2><p>${esc(nm)} pack. All reports read from the same tree.</p></div><button class="btn pri" id="rpNew">New report</button></div>
   <div class="rp-top"><div><b>${all.length} reports</b></div><div class="pill-f">${['all','Monthly','Weekly','Half-yearly','mine'].map(k=>`<button data-rf="${k}" class="${f===k?'on':''}">${k==='all'?'All':k==='mine'?'Added by you':k}</button>`).join('')}</div></div>
   <div class="rp-list"><div class="rp-head"><span>No.</span><span>Report</span><span>Goes to</span><span>When</span><span>This period</span></div>${list.map(r=>{ const nc=(STORE.comments[r.id+'|'+state.per]||[]).length; return `<button class="rp" data-rp="${r.id}"><span class="id">${r.id}</span><div><b>${esc(r.l)}</b><span>${esc(r.d)}${nc?`. ${nc} comment${nc>1?'s':''}`:''}</span></div><span style="color:var(--ink)">${esc(r.to)}</span><span>${esc(r.when)}</span><span><span class="tag ${RST[r.st][1]}">${RST[r.st][0]}</span></span></button>`; }).join('')||'<div class="empty">No reports here yet.</div>'}</div>`; }

  $('#sheet').innerHTML=`<button class="x" id="mClose" aria-label="Close">×</button><h3>New report</h3><div class="sub">Pick the numbers and how to cut them. It reads from the tree every period.</div>

   <label>How often<select id="nrFreq"><option>Monthly</option><option>Weekly</option><option>Half-yearly</option></select></label><label>Cut<select id="nrCut">${Object.entries(CUTS).map(([k,l])=>`<option value="${k}">${l}</option>`).join('')}</select></label></div>

function tableHTML(head,rows,total){ return `<div class="tw"><table class="t"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}${total?`<tr class="total">${total.map(c=>`<td>${c}</td>`).join('')}</tr>`:''}</tbody></table></div>`; }
function customBody(r){ const P=P0(); const ms=r.ms;
  if(r.cut==='company'){ const S=vals({},P,'actual'), B=vals({},P,'budget'), LY=vals({},shiftP(P,12),'actual');
    return tableHTML(['','Actual','Plan','vs plan','Last year'],ms.map(id=>{ const m=N[id]; const dl=delta(m.u,m.v(S),B?m.v(B):null,m.dir); return [m.l,fvt(m.u,m.v(S)),B?fvt(m.u,m.v(B)):'–',`<span class="dchip ${dl.cls}">${chip(m.u,dl)||'–'}</span>`,LY?fvt(m.u,m.v(LY)):'–']; })); }
  const ok=ms.filter(id=>N[id].g==='row');
  const vs= r.cut==='st'? STREAMS.map(s=>[s.l,{st:s.k,div:s.d}]) : r.cut==='reg'? REGIONS.map(x=>[RG_S[x.k],{reg:x.k}]) : DIVS.map(d=>[d.l,{div:d.k}]);
  const rows=vs.map(([l,L])=>{ const a=vals({...EMPTY_L(),...L},P,'actual'), b=vals({...EMPTY_L(),...L},P,'budget'); if(!a) return null;
    return [l,...ok.map(id=>{ const m=N[id]; const dl=delta(m.u,m.v(a),b?m.v(b):null,m.dir); return `${fvt(m.u,m.v(a))} <span class="dchip ${dl.cls}">${chip(m.u,dl)||'–'}</span>`; })]; }).filter(Boolean);
  return tableHTML([CUTS[r.cut].replace('By ',''),...ok.map(id=>N[id].l)],rows)+(ok.length<ms.length?`<div class="deck-note">Group-level numbers are left out of a ${CUTS[r.cut].toLowerCase()} cut.</div>`:'')+`<div class="deck-note">Change shown against plan.</div>`; }
function commentsHTML(r){ const key=r.id+'|'+state.per; const list=STORE.comments[key]||[];
  return `<div class="comments"><h4>Commentary, ${esc(perName(P0()))}</h4>${list.map((c,i)=>`<div class="cmt"><div class="cmt-h"><b>${esc(c.who||'Unnamed')}</b><span>${esc(c.date)}</span><button class="del" data-delc="${i}">Delete</button></div><p>${esc(c.text).replace(/\n/g,'<br>')}</p></div>`).join('')||'<p class="deck-note" style="margin:0 0 10px">No commentary yet.</p>'}

function renderReport(r){ const P=P0(), S=vals({},P,'actual'), B=vals({},P,'budget'), LY=vals({},shiftP(P,12),'actual'); let body='';

  else if(r.r==='pl'){ const ids=['rev','cons','comm','labStaff','supStaff','site','segEbitda','corp','ebitda','da','fin','pbt','tax','nci','pat'];

  else if(r.r==='stream'){ body=tableHTML(['Brand and channel','Revenue, ₹ Cr','EBITDA, ₹ Cr','Margin'],RV.map(x=>[ROW_L[x.rw.id],num(x.a.rev,0),num(x.a.segEbitda,0),num(x.a.segEbitdaM*100,1)+'%']),['Total',num(S.rev,0),num(S.segEbitda,0),num(S.segEbitdaM*100,1)+'%'])+note; }

  if(r.custom) body=customBody(r);
  $('#sheet').innerHTML=`<button class="x" id="mClose" aria-label="Close">×</button><div style="color:var(--mute);font-weight:600">${r.id}</div><h3>${esc(r.l)}</h3><div class="sub">${esc(perName(P))}. Goes to ${esc(r.to)}. ${esc(r.when)}.${r.custom?' <button class="del" id="rpDel">Delete report</button>':''}</div>${body}${commentsHTML(r)}`;

  $('#sheet').querySelectorAll('[data-delc]').forEach(b=>b.onclick=()=>{ STORE.comments[key].splice(+b.dataset.delc,1); saveStore(); renderReport(r); renderPage(); });

function answer(q){ const P=P0(), S=vals({},P,'actual'), LY=vals({},shiftP(P,12),'actual'), pn=perName(P); const ql=q.toLowerCase();

function walkHTML(S){ const steps=[['Revenue','reported',S.rev,'tot'],['Product cost','reported',-S.cons],['Channel commissions','FY26 note shares',-S.comm],['Store and logistics services','FY26 note shares',-S.lab],['Employees','reported',-S.sup],['Stores and overheads','FY26 note shares',-S.site],['Brand EBITDA','',S.segEbitda,'tot'],['Royalty and ad spend','FY26 note shares',-S.corp],['EBITDA',`${num(S.ebitdaM*100,1)}% of revenue, reported`,S.ebitda,'tot'],['Depreciation','reported',-S.daAll],['Interest','net of income earned',-S.fin],['Tax','reported',-S.tax],['Partners’ share','reported',-S.nci],['Net profit to AFL','continuing operations',S.pat,'tot']];
  const max=S.rev*1.02; const X=v=>v/max*100; let run=0; let out='';
  for(const [l,sub,v,tot] of steps){ let left,width,col;
    if(tot){ left=0; width=Math.abs(v); run=v; col='var(--tot)'; } else { const a=run,b=run+v; left=Math.min(a,b); width=Math.abs(v); run=b; col=v<0?'var(--bad)':'var(--good)'; }
    out+=`<div class="wl ${tot?'tot':''}">${l}<small>${sub}</small></div><div class="wb"><div style="left:${Math.max(0,X(left))}%;width:${Math.max(.4,X(width))}%;background:${col}"></div></div><div class="wv ${v<0&&!tot?'bad-t':''}">${am(v)}</div>`; }
  return `<div class="walk">${out}</div>`; }

    holds=['Selling more through AFL’s own stores means holding more stock in those stores.','Each season’s clothes are bought months in advance.','Slow-selling styles are kept rather than cleared early.']; helps=['Send stock to each store based on what it actually sells, and refill weekly.','Clear slow styles early, through the channel that sells them best.','Set a stock limit for each brand and store, and check it every week.']; }
  $('#dTitle').innerHTML=`<h3>${title}</h3><div class="tags"><span class="tag">H1 FY27, estimates</span></div>`;
  $('#dBody').innerHTML=`<div class="h4" style="margin-top:0">${tab[0]}</div>${tableHTML(tab[1],tab[2])}<div class="h4">What usually holds it</div><ul class="plist">${holds.map(x=>`<li>${x}</li>`).join('')}</ul><div class="h4">What helps</div><ul class="plist">${helps.map(x=>`<li>${x}</li>`).join('')}</ul><p class="deck-note">Brand and channel figures are estimates until AFL’s data is connected; reasons and actions are common industry practice.</p><p class="lv-links"><button class="linkb" data-lp="${link}">See in the value tree</button></p>`;
  $('#drawer').classList.add('open'); $('#scrim').classList.add('on');
  $('#dBody').querySelectorAll('[data-lp]').forEach(b=>b.onclick=()=>{ closeDrawer(); goToNode(b.dataset.lp); }); }
function goToNode(id){ const key=treeOf(id); const def=TREES[key]; const par={}; for(const [k,kids] of Object.entries(def.ch)) for(const [c] of kids) par[c]=k;
  let x=id; while(par[x]){ x=par[x]; state.collapsed[x]=false; }
  state.view='tree'; state.tab='pat'; state.per='H1FY27'; state.L=EMPTY_L(); state.sel=id; renderAll();
  setTimeout(()=>{ const el=document.querySelector(`#ti-${key} .node[data-node="${id}"]`); if(el){ el.classList.add('picked'); el.scrollIntoView({block:'center',inline:'center',behavior:'smooth'}); } },60); }
function bindOv(){ const p=$('#page'); p.querySelectorAll('[data-tree]').forEach(b=>b.onclick=()=>goToNode(b.dataset.tree)); p.querySelectorAll('[data-more]').forEach(b=>b.onclick=()=>leverPanel(b.dataset.more));
  const gs=$('#goSc'); if(gs) gs.onclick=()=>{ state.view='sc'; renderAll(); window.scrollTo(0,0); };
  const g=$('#goTree'); if(g) g.onclick=()=>{ state.view='tree'; state.tab='pat'; state.per='H1FY27'; renderAll(); window.scrollTo(0,0); }; }

// ---------- render ----------
function renderPage(){ const p=$('#page'); const v=state.view;
  if(v==='ov'){ p.innerHTML=viewOv(); bindOv(); }
  else if(v==='tree'){ p.innerHTML=viewTree(); bindTreeView(); }
  else if(v==='sc'){ p.innerHTML=viewSc(); bindSc(); }
  else if(v==='rp'){ p.innerHTML=viewRp(); bindRp(); }
  else if(v==='ask'){ p.innerHTML=viewAsk(); bindAsk(); }
  else { p.innerHTML=viewAl(); bindAl(); }
  p.querySelectorAll('.stat[data-node]').forEach(k=>k.onclick=()=>openNode(k.dataset.node)); }
function renderAll(){ renderNav(); renderFilters(); renderPage(); }
$('#dClose').onclick=closeDrawer; $('#scrim').onclick=closeDrawer;
$('#modal').onclick=e=>{ if(e.target.id==='modal') $('#modal').classList.remove('on'); };
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(state.full&&!$('#drawer').classList.contains('open')){ state.full=null; document.body.style.overflow=''; renderPage(); } closeDrawer(); $('#modal').classList.remove('on'); } });
$('#resetBtn').onclick=()=>{ Object.assign(state,{view:'ov',per:'H1FY27',cmp:'ly',L:EMPTY_L(),tab:'pat',collapsed:DEF_COLLAPSE(),zoom:{},treeSc:null,sc:ZERO_SC(),preset:null,convo:[],full:null}); document.body.style.overflow=''; closeDrawer(); renderAll(); };
let rz; window.addEventListener('resize',()=>{ clearTimeout(rz); rz=setTimeout(()=>{ if(state.view==='tree') TABS[state.tab].trees.forEach(applyZoom); },120); });
state.sc=ZERO_SC();
renderAll();

</script>
</body>
